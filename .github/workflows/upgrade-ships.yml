name: Upgrade ship models

on:
  push:
    paths:
      - .github/workflows/upgrade-ships.yml

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Upgrade arena objects
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text()

          old_demo = '.demo-player{position:absolute;width:56px;height:24px;border-radius:var(--pill);background:var(--ink);box-shadow:0 9px 18px rgba(29,29,31,.18)}.demo-player.runner{left:46%;top:52%;transform:rotate(-14deg);background:var(--secondary)}.demo-player.shooter{left:15%;bottom:14%;transform:rotate(-33deg)}.demo-player.shooter2{right:11%;top:18%;transform:rotate(142deg);background:#7e6ce8}'
          new_demo = '.demo-player{position:absolute;width:64px;height:30px;border-radius:999px 999px 18px 18px;background:var(--ink);box-shadow:0 9px 18px rgba(29,29,31,.18)}.demo-player:before,.demo-player:after{content:"";position:absolute;display:block}.demo-player:before{width:18px;height:10px;right:10px;top:10px;border-radius:10px;background:rgba(255,255,255,.82)}.demo-player:after{left:-10px;top:11px;width:12px;height:8px;border-radius:10px;background:rgba(255,159,46,.32)}.demo-player.runner{left:46%;top:52%;transform:rotate(-14deg);background:var(--secondary)}.demo-player.runner:before{background:rgba(255,255,255,.9)}.demo-player.shooter{left:15%;bottom:14%;transform:rotate(-33deg);clip-path:polygon(0 50%,20% 15%,78% 10%,100% 50%,78% 90%,20% 85%)}.demo-player.shooter2{right:11%;top:18%;transform:rotate(142deg);background:#7e6ce8;clip-path:polygon(0 50%,20% 15%,78% 10%,100% 50%,78% 90%,20% 85%)}'
          if old_demo in html:
              html = html.replace(old_demo, new_demo)

          start = html.find('function resizeCanvas()')
          end = html.find('function frame(now)', start)
          if start < 0 or end < 0:
              raise SystemExit('Render block not found')

          replacement = r'''function resizeCanvas(){const r=$('#arenaWrap').getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.max(1,r.width*dpr);canvas.height=Math.max(1,r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
          function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
          function shipModelForPlayer(p){if(state.mode==='hunt')return p.isHost?'glider':'interceptor';const models=['dart','beetle','comet'];return models[Math.abs(hashString(p.id||''))%models.length]}
          function hashString(s){let h=0;for(let i=0;i<s.length;i++)h=((h<<5)-h+s.charCodeAt(i))|0;return h}
          function rgba(hex,a){let raw=String(hex||'').replace('#','');if(raw.length===3)raw=raw.split('').map(c=>c+c).join('');if(raw.length!==6)return`rgba(29,29,31,${a})`;const n=parseInt(raw,16);return`rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
          function poly(pts){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath()}
          function engineGlow(r,color){ctx.save();ctx.fillStyle=rgba(color,.24);ctx.beginPath();ctx.ellipse(-r*.92,0,r*.72,r*.34,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(255,255,255,.52)';ctx.beginPath();ctx.ellipse(-r*1.12,0,r*.18,r*.11,0,0,Math.PI*2);ctx.fill();ctx.restore()}
          function glider(r,c){ctx.fillStyle=c;ctx.strokeStyle='rgba(29,29,31,.16)';ctx.lineWidth=1.1;rr(-r*1.2,-r*.42,r*1.96,r*.84,r*.42);ctx.fill();ctx.stroke();poly([[-r*.3,-r*.78],[r*.22,-r*.28],[-r*.05,-r*.12],[-r*.62,-r*.42]]);ctx.fill();poly([[-r*.3,r*.78],[r*.22,r*.28],[-r*.05,r*.12],[-r*.62,r*.42]]);ctx.fill();rr(r*.52,-r*.2,r*.58,r*.4,r*.2);ctx.fill();ctx.fillStyle='rgba(255,255,255,.84)';rr(r*.05,-r*.18,r*.48,r*.36,r*.18);ctx.fill();ctx.fillStyle='rgba(255,255,255,.4)';rr(-r*.86,-r*.12,r*.28,r*.24,r*.12);ctx.fill()}
          function interceptor(r,c){ctx.fillStyle=c;ctx.strokeStyle='rgba(29,29,31,.16)';ctx.lineWidth=1.1;poly([[-r*.95,0],[-r*.3,-r*.56],[r*.56,-r*.44],[r*1.02,0],[r*.56,r*.44],[-r*.3,r*.56]]);ctx.fill();ctx.stroke();poly([[-r*.52,-r*.84],[r*.02,-r*.34],[-r*.2,-r*.08],[-r*.86,-r*.42]]);ctx.fill();poly([[-r*.52,r*.84],[r*.02,r*.34],[-r*.2,r*.08],[-r*.86,r*.42]]);ctx.fill();ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();ctx.arc(r*.38,0,r*.16,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(255,255,255,.5)';ctx.beginPath();ctx.arc(-r*.28,0,r*.11,0,Math.PI*2);ctx.fill()}
          function dart(r,c){ctx.fillStyle=c;ctx.strokeStyle='rgba(29,29,31,.16)';ctx.lineWidth=1.1;poly([[-r*.94,0],[-r*.28,-r*.46],[r*.84,0],[-r*.28,r*.46]]);ctx.fill();ctx.stroke();poly([[-r*.55,-r*.72],[-r*.08,-r*.18],[-r*.48,-r*.04],[-r*.9,-r*.3]]);ctx.fill();poly([[-r*.55,r*.72],[-r*.08,r*.18],[-r*.48,r*.04],[-r*.9,r*.3]]);ctx.fill();ctx.fillStyle='rgba(255,255,255,.86)';rr(-r*.08,-r*.16,r*.34,r*.32,r*.14);ctx.fill()}
          function beetle(r,c){ctx.fillStyle=c;ctx.strokeStyle='rgba(29,29,31,.16)';ctx.lineWidth=1.1;rr(-r*.84,-r*.58,r*1.55,r*1.16,r*.52);ctx.fill();ctx.stroke();ctx.beginPath();ctx.arc(-r*.56,0,r*.32,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(r*.52,0,r*.24,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(255,255,255,.82)';rr(-r*.12,-r*.22,r*.48,r*.44,r*.18);ctx.fill();ctx.fillStyle='rgba(255,255,255,.34)';rr(-r*.3,-r*.8,r*.42,r*.18,r*.09);ctx.fill();rr(-r*.3,r*.62,r*.42,r*.18,r*.09);ctx.fill()}
          function comet(r,c){ctx.fillStyle=c;ctx.strokeStyle='rgba(29,29,31,.16)';ctx.lineWidth=1.1;poly([[-r*.92,0],[-r*.2,-r*.5],[r*.52,-r*.34],[r*.96,0],[r*.52,r*.34],[-r*.2,r*.5]]);ctx.fill();ctx.stroke();poly([[-r*.28,-r*.88],[r*.12,-r*.2],[-r*.18,-r*.02],[-r*.72,-r*.38]]);ctx.fill();poly([[-r*.28,r*.88],[r*.12,r*.2],[-r*.18,r*.02],[-r*.72,r*.38]]);ctx.fill();ctx.fillStyle='rgba(255,255,255,.85)';ctx.beginPath();ctx.ellipse(r*.28,0,r*.22,r*.16,0,0,Math.PI*2);ctx.fill()}
          function drawShip(p,w,h){const x=p.x*w,y=p.y*h,r=Math.max(15,p.r*Math.min(w,h)),c=p.color||'#1d1d1f';ctx.save();ctx.globalAlpha=p.alive?1:.2;if(p.invuln>0&&Math.floor(p.invuln/80)%2===0)ctx.globalAlpha=.38;ctx.translate(x,y);const q=nearestTarget(p);if(q)ctx.rotate(Math.atan2((q.y-p.y)*h,(q.x-p.x)*w));else if(Math.hypot(p.vx||0,p.vy||0)>.02)ctx.rotate(Math.atan2((p.vy||0)*h,(p.vx||0)*w));ctx.shadowColor='rgba(29,29,31,.15)';ctx.shadowBlur=16;ctx.shadowOffsetY=7;engineGlow(r,c);const model=shipModelForPlayer(p);if(model==='glider')glider(r,c);else if(model==='interceptor')interceptor(r,c);else if(model==='beetle')beetle(r,c);else if(model==='comet')comet(r,c);else dart(r,c);ctx.restore();if(p.alive){ctx.fillStyle='rgba(0,0,0,.12)';rr(x-r*1.08,y-r-13,r*2.16,5,3);ctx.fill();ctx.fillStyle=c;rr(x-r*1.08,y-r-13,r*2.16*(p.hp/p.maxHp),5,3);ctx.fill()}}
          function drawBolt(b,w,h){const x=b.x*w,y=b.y*h,m=Math.hypot(b.vx,b.vy)||1,nx=b.vx/m,ny=b.vy/m;ctx.save();ctx.strokeStyle=b.color;ctx.lineWidth=4;ctx.lineCap='round';ctx.shadowColor=b.color;ctx.shadowBlur=14;ctx.beginPath();ctx.moveTo(x-nx*19,y-ny*19);ctx.lineTo(x,y);ctx.stroke();ctx.strokeStyle='rgba(255,255,255,.82)';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(x-nx*11,y-ny*11);ctx.lineTo(x,y);ctx.stroke();ctx.fillStyle=b.color;ctx.beginPath();ctx.arc(x,y,2.8,0,Math.PI*2);ctx.fill();ctx.restore()}
          function draw(){if(!screens.game.classList.contains('active'))return;const w=canvas.width/dpr,h=canvas.height/dpr;ctx.clearRect(0,0,w,h);ctx.fillStyle='#fffdf9';ctx.fillRect(0,0,w,h);ctx.fillStyle='rgba(184,80,10,.10)';for(let y=20;y<h;y+=28)for(let x=20;x<w;x+=28){ctx.beginPath();ctx.arc(x,y,1,0,Math.PI*2);ctx.fill()}state.bullets.forEach(b=>drawBolt(b,w,h));state.players.forEach(p=>drawShip(p,w,h));const left=Math.max(0,state.roundEndAt-Date.now());$('#timerText').textContent=`${Math.floor(left/60000)}:${String(Math.ceil(left%60000/1000)).padStart(2,'0')}`}
          '''

          html = html[:start] + replacement + html[end:]
          path.write_text(html)

      - name: Check JavaScript syntax
        shell: python
        run: |
          from pathlib import Path
          html = Path('index.html').read_text()
          js = html.rsplit('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/glued-arena.js').write_text(js)

      - run: node --check /tmp/glued-arena.js

      - name: Commit upgrade
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Upgrade arena ship models"
          git push
