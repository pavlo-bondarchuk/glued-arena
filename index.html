<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#fffdf9">
<title>Glued Arena</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#fffdf9}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.boot{height:100%;display:grid;place-items:center;color:#6f6a63;font-weight:600}.boot:before{content:"";width:24px;height:24px;border:3px solid #e7ddcf;border-top-color:#ff9f2e;border-radius:50%;animation:spin .8s linear infinite;margin-right:10px}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body><div class="boot">Glued Arena</div>
<script>
fetch('app.html',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('app');return r.text()}).then(html=>{
const previewStyle=`<style id="battle-preview-style">.demo-arena{background-image:linear-gradient(180deg,rgba(255,253,249,.02),rgba(255,253,249,.12)),url('battle-preview.webp')!important;background-size:cover!important;background-position:center!important}.demo-grid,.demo-player,.demo-laser{display:none!important}.demo-label{z-index:2;box-shadow:0 10px 28px rgba(29,29,31,.10)}.demo-arena:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 72% 14%,rgba(255,231,199,.22),transparent 34%);pointer-events:none;z-index:1}</style>`;
html=html.replace('</head>',previewStyle+'</head>');
document.open();document.write(html);document.close();
}).catch(()=>{document.body.innerHTML='<div class="boot">Не вдалося завантажити Glued Arena</div>'});
</script></body></html>
