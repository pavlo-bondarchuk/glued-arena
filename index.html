<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#fffdf9">
<title>Glued Arena</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%231d1d1f'/%3E%3Ccircle cx='32' cy='32' r='12' fill='none' stroke='%23ff9f2e' stroke-width='6'/%3E%3C/svg%3E">
<style>
html,body{margin:0;width:100%;height:100%;background:#fffdf9}.boot{height:100%;display:flex;align-items:center;justify-content:center;gap:10px;color:#6f6a63;font:600 14px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.boot:before{content:"";width:24px;height:24px;border:3px solid #e7ddcf;border-top-color:#ff9f2e;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body><div class="boot">Glued Arena</div>
<script>
(async()=>{
try{
const response=await fetch('app.html',{cache:'no-store'});
if(!response.ok)throw new Error('app');
const source=await response.text();
const parsed=new DOMParser().parseFromString(source,'text/html');
const scripts=[...parsed.querySelectorAll('script')].map(s=>({src:s.src,text:s.textContent,type:s.type||''}));
parsed.querySelectorAll('script').forEach(s=>s.remove());
[...parsed.head.children].forEach(node=>{if(node.tagName==='STYLE'||node.tagName==='LINK')document.head.appendChild(node.cloneNode(true))});
document.body.innerHTML=parsed.body.innerHTML;
const patch=document.createElement('style');
patch.textContent=`
.demo-preview{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;z-index:0}
.demo-arena{background:#141414!important}
.demo-arena:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,253,249,.02),rgba(255,253,249,.04) 58%,rgba(29,29,31,.08));pointer-events:none;z-index:1}
.demo-label{z-index:2!important;box-shadow:0 10px 28px rgba(29,29,31,.10)}
.qr-wrap img{display:block!important;width:90px!important;height:90px!important}
.qr-wrap canvas{display:none!important}
.invite-title,.invite-hint,#shareLinkBtn{display:none!important}
.qr-help-wrap{position:relative;display:flex;align-items:center;gap:8px;flex:0 0 auto}
.qr-help{width:28px;height:28px;border:1px solid var(--border);border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;font:800 15px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:0;box-shadow:0 5px 14px rgba(29,29,31,.06)}
.qr-help:hover,.qr-help:focus-visible{background:var(--ink);color:#fff;outline:none}
.qr-tooltip{position:absolute;left:50%;bottom:calc(100% + 10px);width:240px;transform:translateX(-50%) translateY(4px);padding:11px 12px;border-radius:14px;background:var(--ink);color:#fff;font:600 12px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;box-shadow:0 12px 30px rgba(29,29,31,.18);opacity:0;visibility:hidden;pointer-events:none;transition:.15s ease;z-index:40}
.qr-help-wrap:hover .qr-tooltip,.qr-help-wrap:focus-within .qr-tooltip{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
.tooltip-en{display:none}html[lang="en"] .tooltip-uk{display:none}html[lang="en"] .tooltip-en{display:inline}
@media(max-width:620px){.room-share{align-items:flex-start!important}.qr-tooltip{left:0;transform:translateY(4px);width:min(230px,72vw)}.qr-help-wrap:hover .qr-tooltip,.qr-help-wrap:focus-within .qr-tooltip{transform:translateY(0)}}`;
document.head.appendChild(patch);
const arena=document.querySelector('.demo-arena');
if(arena){
const label=arena.querySelector('.demo-label');
arena.replaceChildren();
const img=document.createElement('img');
img.className='demo-preview';
img.src='battle-preview.webp';
img.alt='';
img.decoding='async';
arena.appendChild(img);
if(label)arena.appendChild(label);
}
const qr=document.querySelector('#roomQr');
if(qr&&!qr.parentElement.classList.contains('qr-help-wrap')){
const wrap=document.createElement('div');
wrap.className='qr-help-wrap';
qr.parentNode.insertBefore(wrap,qr);
wrap.appendChild(qr);
const help=document.createElement('button');
help.type='button';
help.className='qr-help';
help.setAttribute('aria-label','Info');
help.textContent='?';
const tip=document.createElement('div');
tip.className='qr-tooltip';
tip.innerHTML='<span class="tooltip-uk">Відскануйте QR — пристрій одразу приєднається до цієї кімнати.</span><span class="tooltip-en">Scan the QR code to join this room instantly.</span>';
wrap.append(help,tip);
}
for(const item of scripts){
await new Promise((resolve,reject)=>{
const s=document.createElement('script');
if(item.type)s.type=item.type;
if(item.src){s.src=item.src;s.onload=resolve;s.onerror=reject;document.head.appendChild(s)}else{s.textContent=item.text;document.body.appendChild(s);resolve()}
});
}
document.querySelector('#shareLinkBtn')?.remove();
}catch(e){document.body.innerHTML='<div class="boot">Не вдалося завантажити Glued Arena</div>';console.error(e)}
})();
</script>
</body>
</html>
