<body><div class="boot">Glued Arena</div>
<script>
(async()=>{
try{
const response=await fetch('app.html',{cache:'no-store'});
if(!response.ok)throw new Error('app');
const source=await response.text();
const parsed=new DOMParser().parseFromString(source,'text/html');
const scripts=[...parsed.querySelectorAll('script')].map(s=>({src:s.src,text:s.textContent,type:s.type||''}));
parsed.querySelectorAll('script').forEach(s=>s.remove());
[...parsed.head.children].forEach(node=>{if(node.tagName==='STYLE'||node.tagName==='LINK')document.head.appendChild(node.cloneNode(true))});
document.body.innerHTML=parsed.body.innerHTML;
const patch=document.createElement('style');
patch.textContent=`
.demo-preview{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;z-index:0}
.demo-arena{background:#141414!important}
.demo-arena:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,253,249,.02),rgba(255,253,249,.04) 58%,rgba(29,29,31,.08));pointer-events:none;z-index:1}
.demo-label{z-index:2!important;box-shadow:0 10px 28px rgba(29,29,31,.10)}
.qr-wrap img{display:block!important;width:90px!important;height:90px!important}
.qr-wrap canvas{display:none!important}
.invite-title,.invite-hint,.invite-link,#shareLinkBtn{display:none!important}
.qr-help-wrap{position:relative;display:flex;align-items:center;gap:8px;flex:0 0 auto}
.qr-help{width:28px;height:28px;border:1px solid var(--border);border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;font:800 15px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:0;box-shadow:0 5px 14px rgba(29,29,31,.06)}
.qr-help:hover,.qr-help:focus-visible{background:var(--ink);color:#fff;outline:none}
.qr-tooltip{position:absolute;left:50%;bottom:calc(100% + 10px);width:240px;transform:translateX(-50%) translateY(4px);padding:11px 12px;border-radius:14px;background:var(--ink);color:#fff;font:600 12px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;box-shadow:0 12px 30px rgba(29,29,31,.18);opacity:0;visibility:hidden;pointer-events:none;transition:.15s ease;z-index:40}

.tooltip-en{display:none}html[lang="en"] .tooltip-uk{display:none}html[lang="en"] .tooltip-en{display:inline}
@media(max-width:620px){.room-share{align-items:flex-start!important}.qr-tooltip{left:0;transform:translateY(4px);width:min(230px,72vw)}.qr-help-wrap:hover .qr-tooltip,.qr-help-wrap:focus-within .qr-tooltip{transform:translateY(0)}}`;
